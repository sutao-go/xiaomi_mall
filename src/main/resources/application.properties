# ===== 数据源 =====
# 密码等敏感信息通过环境变量注入，不再硬编码（原文件明文写死 St123456）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/xiaomi_mall?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP 连接池（替换原项目几乎零配置的 c3p0）
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000

# ===== MyBatis =====
mybatis.type-aliases-package=com.imooc.entity
mybatis.config-location=classpath:mybatis-config.xml
mybatis.mapper-locations=classpath:/mapper/**.xml

# ===== 服务端口 =====
server.port=28089

# 静态资源：webapp 已在 pom.xml 中映射到 classpath:/static，
# 通过 /templates/**、/resources/** 直接访问，不再需要 ResourcesController
spring.web.resources.cache.period=3600

# ===== Sa-Token =====
# Token 名称（同时也是 Cookie 名）
sa-token.token-name=satoken
# Token 有效期（秒），86400 = 1 天；-1 代表永不过期
sa-token.timeout=86400
# 临时有效期：长时间无操作即失效，-1 代表不限制
sa-token.activity-timeout=-1
# 允许同一账号多地登录（true=共存，false=新登录挤掉旧登录）
sa-token.is-concurrent=true
# 多人登录同一账号时是否共用 Token
sa-token.is-share=false
# Token 风格
sa-token.token-style=uuid
