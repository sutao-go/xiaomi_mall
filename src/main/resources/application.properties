# ===== 数据源 =====
# 密码等敏感信息通过环境变量注入，不再硬编码（原文件明文写死 St123456）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/xiaomi_mall?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP 连接池（替换原项目几乎零配置的 c3p0）
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000

# ===== MyBatis =====
mybatis.type-aliases-package=com.imooc.entity
mybatis.config-location=classpath:mybatis-config.xml
mybatis.mapper-locations=classpath:/mapper/**.xml

# ===== 服务端口 =====
server.port=28089

# 静态资源：webapp 已在 pom.xml 中映射到 classpath:/static，
# 通过 /templates/**、/resources/** 直接访问，不再需要 ResourcesController
spring.web.resources.cache.period=3600
